name: Run benchmark

on:
  workflow_call:
    inputs:
      os:
        default: 'ubuntu-latest'
        required: false
        type: string
      java-version:
        default: '8'
        required: false
        type: string
      spark-version:
        default: '3.5.4'
        required: false
        type: string
      spark-binary-version:
        default: '3.5'
        required: false
        type: string
      scala-version:
        default: '2.12.17'
        required: false
        type: string
      scala-binary-version:
        default: '2.12'
        required: false
        type: string
      benchmark:
        description: 'Benchmark to run (tpcds or tpch)'
        required: true
        type: string
      benchmark-scale:
        description: 'Scale factor for benchmark, like: tiny, 1, 10, 100, 1000...'
        required: true
        type: string
      comet-cache-key:
        description: 'Cache key of the comet jar built by build-native-engine'
        required: true
        type: string
      auron-cache-key:
        description: 'Cache key of the auron jar built by build-native-engine'
        required: true
        type: string
      gluten-cache-key:
        description: 'Cache key of the gluten jar built by build-native-engine'
        required: true
        type: string

permissions:
  issues: write

jobs:
  run-benchmark:
    name: Run all benchmarks and report results
    runs-on: ${{ inputs.os }}
    # Keep all engines in one job so each comparison uses the same runner.
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Get cached benchmark lib
        uses: actions/cache/restore@v5
        with:
          path: benchmarks-spark-native-*.jar
          key: benchmarks-spark-native-lib-${{ hashFiles('pom.xml', '**/*.scala', '**/*.java') }}
          fail-on-cache-miss: 'true'
      - name: Get cached benchmark data
        uses: actions/cache/restore@v5
        with:
          path: |
            data/warehouse/*
            data/metastore/*
            check_files_${{ inputs.benchmark }}/*
          key: benchmarks-data-${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}
          fail-on-cache-miss: 'true'
      - name: Setup Spark
        uses: ./.github/actions/setup-spark
        with:
          spark-version: ${{ inputs.spark-version }}
          scala-binary-version: ${{ inputs.scala-binary-version }}
      - name: Run benchmark on vanilla
        run: |
          WAREHOUSE_PATH=$(pwd)/data/warehouse
          METASTORE_PATH=$(pwd)/data/metastore
          BENCHMARK_JAR=$(ls benchmarks-spark-native-*.jar)
          $SPARK_HOME/bin/spark-submit \
            --master local\[4\] \
            --conf spark.sql.warehouse.dir=$WAREHOUSE_PATH \
            --conf spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:derby:\;databaseName=$METASTORE_PATH\;create=true \
            --conf spark.driver.memory=8g \
            --class cn.wangz.spark.benchmarks.Main \
            $BENCHMARK_JAR \
            benchmark --type=${{ inputs.benchmark }} --scale=${{ inputs.benchmark-scale }} --output=benchmark-results/vanilla
      - name: Upload vanilla benchmark result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark_result_vanilla_${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}
          path: |
            benchmark-results/vanilla/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json
      - name: Get cached Datafusion Comet lib
        uses: actions/cache/restore@v5
        with:
          path: comet-spark-spark${{ inputs.spark-binary-version }}_${{ inputs.scala-binary-version }}-*.jar
          key: ${{ inputs.comet-cache-key }}
          fail-on-cache-miss: 'true'
      - name: Run benchmark on comet
        run: |
          # Remove this engine from the shared Spark installation even if the run fails.
          trap 'rm -f "$SPARK_HOME"/jars/comet-spark-spark${{ inputs.spark-binary-version }}_${{ inputs.scala-binary-version }}-*.jar' EXIT
          cp comet-spark-spark${{ inputs.spark-binary-version }}_${{ inputs.scala-binary-version }}-*.jar $SPARK_HOME/jars
          WAREHOUSE_PATH=$(pwd)/data/warehouse
          METASTORE_PATH=$(pwd)/data/metastore
          BENCHMARK_JAR=$(ls benchmarks-spark-native-*.jar)
          $SPARK_HOME/bin/spark-submit \
            --master local\[4\] \
            --conf spark.sql.warehouse.dir=$WAREHOUSE_PATH \
            --conf spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:derby:\;databaseName=$METASTORE_PATH\;create=true \
            --conf spark.driver.memory=4g \
            --conf spark.plugins=org.apache.spark.CometPlugin \
            --conf spark.comet.enabled=true \
            --conf spark.shuffle.manager=org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager \
            --conf spark.memory.offHeap.enabled=true \
            --conf spark.memory.offHeap.size=8g \
            --conf spark.comet.columnar.shuffle.unifiedMemoryAllocatorTest=true \
            --class cn.wangz.spark.benchmarks.Main \
            $BENCHMARK_JAR \
            benchmark --type=${{ inputs.benchmark }} --scale=${{ inputs.benchmark-scale }} --output=benchmark-results/comet
      - name: Upload comet benchmark result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark_result_comet_${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}
          path: |
            benchmark-results/comet/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json
      - name: Get cached auron lib
        uses: actions/cache/restore@v5
        with:
          path: auron-spark-${{inputs.spark-binary-version}}*.jar
          key: ${{ inputs.auron-cache-key }}
          fail-on-cache-miss: 'true'
      - name: Run benchmark on auron
        run: |
          # Remove this engine from the shared Spark installation even if the run fails.
          trap 'rm -f "$SPARK_HOME"/jars/auron-spark-${{ inputs.spark-binary-version }}*.jar' EXIT
          cp auron-spark-${{inputs.spark-binary-version}}*.jar $SPARK_HOME/jars
          WAREHOUSE_PATH=$(pwd)/data/warehouse
          METASTORE_PATH=$(pwd)/data/metastore
          BENCHMARK_JAR=$(ls benchmarks-spark-native-*.jar)
          $SPARK_HOME/bin/spark-submit \
            --master local\[4\] \
            --conf spark.sql.warehouse.dir=$WAREHOUSE_PATH \
            --conf spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:derby:\;databaseName=$METASTORE_PATH\;create=true \
            --conf spark.driver.memory=4g \
            --conf spark.driver.memoryOverhead=8g \
            --conf spark.executor.memory=4g \
            --conf spark.executor.memoryOverhead=8g \
            --conf spark.log.level=warn \
            --conf spark.sql.extensions=org.apache.spark.sql.auron.AuronSparkSessionExtension \
            --conf spark.auron.enable=true \
            --conf spark.auron.native.log.level=warn \
            --conf spark.shuffle.manager=org.apache.spark.sql.execution.auron.shuffle.AuronShuffleManager \
            --conf spark.memory.offHeap.enabled=false \
            --conf spark.auron.decimal.arithOp.enabled=true \
            --conf spark.auron.tokio.worker.threads.per.cpu=1 \
            --class cn.wangz.spark.benchmarks.Main \
            $BENCHMARK_JAR \
            benchmark --type=${{ inputs.benchmark }} --scale=${{ inputs.benchmark-scale }} --output=benchmark-results/auron
      - name: Upload auron benchmark result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark_result_auron_${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}
          path: |
            benchmark-results/auron/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json
      - name: Get cached gluten lib
        uses: actions/cache/restore@v5
        with:
          path: gluten-velox-bundle-spark*.jar
          key: ${{ inputs.gluten-cache-key }}
          fail-on-cache-miss: 'true'
      - name: Run benchmark on gluten
        run: |
          # Remove this engine from the shared Spark installation even if the run fails.
          trap 'rm -f "$SPARK_HOME"/jars/gluten-velox-bundle-spark*.jar' EXIT
          GLUTEN_JAR=$(realpath gluten-velox-bundle-spark*.jar)
          cp "$GLUTEN_JAR" "$SPARK_HOME/jars/"
          WAREHOUSE_PATH=$(pwd)/data/warehouse
          METASTORE_PATH=$(pwd)/data/metastore
          BENCHMARK_JAR=$(ls benchmarks-spark-native-*.jar)
          $SPARK_HOME/bin/spark-submit \
            --master local\[4\] \
            --conf spark.sql.warehouse.dir=$WAREHOUSE_PATH \
            --conf spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:derby:\;databaseName=$METASTORE_PATH\;create=true \
            --conf "spark.driver.extraClassPath=$GLUTEN_JAR" \
            --conf "spark.executor.extraClassPath=$GLUTEN_JAR" \
            --conf spark.driver.extraJavaOptions="--add-modules=jdk.incubator.vector -Dio.netty.tryReflectionSetAccessible=true --enable-native-access=ALL-UNNAMED" \
            --conf spark.driver.memory=4g \
            --conf spark.plugins=org.apache.gluten.GlutenPlugin \
            --conf spark.gluten.enabled=true \
            --conf spark.shuffle.manager=org.apache.spark.shuffle.sort.ColumnarShuffleManager \
            --conf spark.memory.offHeap.enabled=true \
            --conf spark.memory.offHeap.size=8g \
            --class cn.wangz.spark.benchmarks.Main \
            $BENCHMARK_JAR \
            benchmark --type=${{ inputs.benchmark }} --scale=${{ inputs.benchmark-scale }} --output=benchmark-results/gluten
      - name: Upload gluten benchmark result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark_result_gluten_${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}
          path: |
            benchmark-results/gluten/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json
      - name: Generate comparison
        run: |
          ls -all
          pip install -r requirements.txt
          python scripts/generate-comparison.py \
            benchmark-results/vanilla/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json benchmark-results/auron/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json benchmark-results/comet/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json benchmark-results/gluten/${{ inputs.benchmark }}_${{ inputs.benchmark-scale }}.json \
            --labels "Spark" "Auron" "Comet" "Gluten" \
            --benchmark "${{ inputs.benchmark }}" --title "${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}"
          ls -all
      - name: Upload comparison
        uses: actions/upload-artifact@v6
        with:
          name: comparison_${{ inputs.benchmark }}-${{ inputs.benchmark-scale }}
          path: |
            *_allqueries.png
            *_queries_compare.png
            *_queries_speedup_*.png
