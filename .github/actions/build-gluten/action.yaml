name: build-gluten
description: 'Build Gluten and cache the jar by checked-out commit'
inputs:
  java-version:
    description: 'jdk version to build with'
    required: false
    default: '8'
  spark-binary-version:
    description: 'spark binary version (e.g. 3.5)'
    required: false
    default: '3.5'
  scala-binary-version:
    description: 'scala binary version (e.g. 2.12)'
    required: false
    default: '2.12'
  repository:
    description: 'repository of gluten to build'
    required: false
    default: 'apache/gluten'
  ref:
    description: 'branch/commit of gluten to build'
    required: false
    default: 'main'
outputs:
  cache-key:
    description: 'Cache key of the built gluten jar'
    value: ${{ steps.cache-key.outputs.key }}
  jar-path:
    description: 'Glob path of the built gluten jar'
    value: gluten-velox-bundle-spark*.jar
runs:
  using: composite
  steps:
    - name: Checkout Gluten
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.repository }}
        path: gluten
        ref: ${{ inputs.ref }}
        fetch-depth: 1
    - name: Resolve commit and cache key
      id: cache-key
      shell: bash
      run: |
        commit=$(git -C gluten rev-parse HEAD)
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        # Include the build recipe to invalidate incomplete jars from older builds.
        echo "key=gluten-almalinux8-${{ runner.arch }}-spark${{ inputs.spark-binary-version }}-scala${{ inputs.scala-binary-version }}-java${{ inputs.java-version }}-${{ hashFiles('.github/actions/build-gluten/action.yaml') }}-$commit" >> "$GITHUB_OUTPUT"
    - name: Get cached gluten lib
      id: get-gluten-spark-cache
      uses: actions/cache/restore@v5
      with:
        path: gluten-velox-bundle-spark*.jar
        key: ${{ steps.cache-key.outputs.key }}
    - name: Setup Rust & Java toolchain
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-builder
      with:
        jdk-version: ${{ inputs.java-version }}
    - name: Setup Maven
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-maven
    - name: Get date
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      id: get-date
      shell: bash
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    - name: Get cached gluten ccache
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      id: gluten-ccache-cache
      uses: actions/cache@v5
      with:
        path: gluten/.ccache
        key: ccache-almalinux8-release-default-${{ runner.arch }}-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ccache-almalinux8-release-default-${{ runner.arch }}-
    - name: Build Gluten native libraries
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd gluten
        # Match apache/gluten's build_bundle_package.yml native build environment.
        docker run --rm -v "$GITHUB_WORKSPACE/gluten:/work" -w /work \
          apache/gluten:vcpkg-almalinux-8-gcc13 bash -euo pipefail -c '
          yum install -y bison
          df -a
          export CCACHE_DIR=/work/.ccache
          export CCACHE_MAXSIZE=1G
          bash dev/ci-velox-buildstatic-centos-8.sh
          test -s cpp/build/releases/libgluten.so
          ccache -s
          mkdir -p /work/.m2/repository/org/apache/arrow/
          cp -r /root/.m2/repository/org/apache/arrow/* /work/.m2/repository/org/apache/arrow/
        '
    - name: Build Gluten bundle
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GLUTEN_SPARK_VERSION: ${{ inputs.spark-binary-version }}
        GLUTEN_JAVA_VERSION: ${{ inputs.java-version }}
      run: |
        cd gluten
        test -s cpp/build/releases/libgluten.so
        mkdir -p ~/.m2/repository/org/apache/arrow
        cp -r "$GITHUB_WORKSPACE"/gluten/.m2/repository/org/apache/arrow/* ~/.m2/repository/org/apache/arrow/
        GLUTEN_PROFILES=("-Pspark-$GLUTEN_SPARK_VERSION" -Pbackends-velox -Pceleborn -Puniffle)
        if [ "$GLUTEN_JAVA_VERSION" != "8" ]; then
          GLUTEN_PROFILES+=("-Pjava-$GLUTEN_JAVA_VERSION")
        fi
        ./build/mvn clean install "${GLUTEN_PROFILES[@]}" -DskipTests -Dmaven.source.skip
        cp package/target/gluten-velox-bundle-spark*.jar ..
    - name: Cached Gluten lib
      if: steps.get-gluten-spark-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: gluten-velox-bundle-spark*.jar
        key: ${{ steps.cache-key.outputs.key }}
